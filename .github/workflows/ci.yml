name: Verify FocusFlow
on:
  push:
    branches: [main, feat/focusflow-app]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - if: matrix.package == 'server'
        run: npm test && npm run build
      - if: matrix.package == 'mobile'
        run: npm test -- --runInBand
  android:
    runs-on: ubuntu-latest
    needs: packages
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        working-directory: mobile
      - name: Install matching Android packages
        run: |
          python -c "print('y\n' * 100)" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Build standalone local APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleLocal -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=4 --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: FocusFlow-local
          path: mobile/android/app/build/outputs/apk/local/*.apk
          if-no-files-found: error
