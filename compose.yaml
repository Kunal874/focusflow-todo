services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - focusflow_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/focusflow
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET before starting Compose}
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  focusflow_data:
